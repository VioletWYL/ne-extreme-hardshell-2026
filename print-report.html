<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>东北冬季极寒徒步（-15°C ~ -35°C）硬壳冲锋衣外层采购指南｜A4打印终稿</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }

    * { box-sizing: border-box; }

    :root {
      --bg-surface: #FFFFFF;
      --bg-paper: #F6F4EF;
      --bg-tint: #EFF2F6;
      --bg-cobalt-soft: #EDF3FB;
      --bg-amber-soft: #FFF8EC;
      --bg-pine-soft: #F0F7F2;
      --bg-crimson-soft: #FEF2F2;
      --ink-primary: #12171D;
      --ink-secondary: #3E4854;
      --ink-muted: #5C6875;
      --border-hair: #D4DBE3;
      --accent-cobalt: #1E4E8C;
      --accent-ochre: #B45309;
      --accent-pine: #166534;
      --accent-crimson: #991B1B;
      --font-serif: "Noto Serif CJK SC", "Source Han Serif SC", Georgia, serif;
      --font-sans: "Noto Sans CJK SC", "PingFang SC", -apple-system, sans-serif;
      --font-mono: "Noto Sans Mono CJK SC", ui-monospace, Menlo, monospace;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #E2E6EB;
      font-family: var(--font-sans);
      color: var(--ink-primary);
      font-size: 9.8px;
      line-height: 1.42;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    a { color: var(--accent-cobalt); text-decoration: none; font-weight: 600; }
    h1, h2, h3, h4 { font-family: var(--font-serif); margin: 0; color: var(--ink-primary); }
    p { margin: 0; }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    .a4-page {
      width: 210mm;
      height: 297mm;
      margin: 0 auto 10px auto;
      padding: 9mm 11.5mm 8.5mm 11.5mm;
      background: #FFFFFF;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      page-break-after: always;
      break-after: page;
    }
    .a4-page:last-of-type {
      page-break-after: auto;
      break-after: auto;
      margin-bottom: 0;
    }

    @media print {
      html, body { background: #FFFFFF; }
      .a4-page { margin: 0; box-shadow: none; }
    }

    /* Running Header & Footer */
    .running-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 8.4px;
      color: var(--ink-muted);
      padding-bottom: 4.5px;
      border-bottom: 1px solid var(--border-hair);
      margin-bottom: 7px;
      flex-shrink: 0;
    }

    .running-foot {
      margin-top: auto;
      padding-top: 5px;
      border-top: 1px solid var(--border-hair);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 8.4px;
      color: var(--ink-muted);
      flex-shrink: 0;
    }

    /* Page 1 Masthead */
    .masthead {
      background: var(--ink-primary);
      color: #FFFFFF;
      border-top: 3.5px solid var(--accent-ochre);
      border-radius: 5px;
      padding: 11px 16px 12px 16px;
      margin-bottom: 9px;
      flex-shrink: 0;
    }
    .masthead-kicker {
      font-family: var(--font-mono);
      font-size: 8.5px;
      color: #E2B07E;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .masthead h1 {
      color: #FFFFFF;
      font-size: 19.5px;
      line-height: 1.24;
      margin-bottom: 3px;
    }
    .masthead-sub {
      color: #D2DCE6;
      font-size: 10px;
    }

    /* Page 1 Top Info Pair */
    .top-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .info-box {
      background: var(--bg-paper);
      border: 1px solid var(--border-hair);
      border-radius: 5px;
      padding: 8px 11px;
    }
    .info-box.audit-theme {
      background: var(--bg-pine-soft);
      border-color: #BDD8C3;
    }
    .info-box-title {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--accent-cobalt);
      margin-bottom: 5px;
    }
    .info-box.audit-theme .info-box-title { color: var(--accent-pine); }
    .kv-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px 10px;
      font-size: 9.2px;
      margin-bottom: 5px;
    }
    .kv-grid b { color: var(--ink-primary); }
    .info-foot {
      font-size: 8.6px;
      color: var(--ink-secondary);
      border-top: 1px dashed var(--border-hair);
      padding-top: 4px;
      line-height: 1.38;
    }

    /* Section Headings on Page 1 & Tables */
    .sec-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1.5px solid var(--accent-cobalt);
      padding-bottom: 3px;
      margin-bottom: 7px;
      flex-shrink: 0;
    }
    .sec-title-bar h2 {
      font-size: 12.8px;
      color: var(--ink-primary);
    }
    .sec-title-bar span {
      font-size: 8.6px;
      color: var(--ink-muted);
    }

    /* 4-Layer Strip */
    .layer-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .layer-box {
      border: 1px solid var(--border-hair);
      border-radius: 5px;
      padding: 7px 8px;
      background: #FFFFFF;
    }
    .layer-box.focus {
      background: var(--bg-cobalt-soft);
      border: 1.5px solid var(--accent-cobalt);
    }
    .layer-k { font-size: 9px; font-weight: 700; color: var(--accent-cobalt); margin-bottom: 2px; }
    .layer-box.focus .layer-k { color: var(--accent-ochre); }
    .layer-s { font-size: 9.4px; font-weight: 700; margin-bottom: 3px; line-height: 1.3; }
    .layer-b { font-size: 8.5px; color: var(--ink-secondary); line-height: 1.36; }

    /* 3 Ultimate Trio */
    .ult-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .ult-card {
      border: 1.2px solid var(--accent-ochre);
      border-radius: 5px;
      padding: 8px 9px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: #FFFFFF;
    }
    .ult-kicker { font-size: 8.8px; font-weight: 700; color: var(--accent-ochre); }
    .ult-top { display: flex; gap: 7px; align-items: center; }
    .ult-thumb {
      width: 44px;
      height: 52px;
      border: 1px solid var(--border-hair);
      border-radius: 3px;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #FFFFFF;
    }
    .ult-thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .ult-name { font-family: var(--font-serif); font-size: 10.3px; font-weight: 700; line-height: 1.28; }
    .ult-meta { font-family: var(--font-mono); font-size: 8.2px; color: var(--ink-muted); margin-top: 2px; }
    .ult-summary { font-size: 8.6px; color: var(--ink-secondary); line-height: 1.38; }
    .ult-size {
      margin-top: auto;
      background: var(--bg-amber-soft);
      border-left: 2.5px solid var(--accent-ochre);
      padding: 4px 6px;
      font-size: 8.5px;
      font-weight: 700;
      color: #7C2D12;
      border-radius: 0 3px 3px 0;
    }

    /* Compact Tables */
    table.p-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 8.6px;
      border: 1px solid var(--border-hair);
      flex-shrink: 0;
    }
    table.p-table th {
      background: var(--ink-primary);
      color: #FFFFFF;
      text-align: left;
      padding: 4.5px 6px;
      font-weight: 700;
      font-size: 8.3px;
    }
    table.p-table td {
      padding: 4.2px 6px;
      border-bottom: 1px solid var(--border-hair);
      vertical-align: top;
      line-height: 1.35;
    }
    table.p-table tr.hl td { background: var(--bg-amber-soft); }

    /* Category Divider Header on Product Pages */
    .cat-banner {
      background: var(--bg-tint);
      border-left: 4px solid var(--ink-primary);
      padding: 5px 10px;
      border-radius: 0 4px 4px 0;
      margin-bottom: 6.5px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-shrink: 0;
    }
    .cat-banner h2 { font-size: 13px; }
    .cat-banner span { font-size: 8.6px; color: var(--ink-secondary); }

    /* Product Dossier Card in Print */
    .dossier {
      border: 1px solid var(--border-hair);
      border-radius: 6px;
      padding: 9px 11px;
      margin-bottom: 8px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      gap: 6px;
      break-inside: avoid;
    }
    .dossier.is-ult {
      border: 1.4px solid var(--accent-ochre);
    }
    .dossier-top {
      display: flex;
      gap: 11px;
      align-items: flex-start;
    }
    .dossier-img {
      width: 78px;
      height: 92px;
      border: 1px solid var(--border-hair);
      border-radius: 4px;
      padding: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      flex-shrink: 0;
    }
    .dossier-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .dossier-head { flex: 1; min-width: 0; }
    .d-pills { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: 3px; }
    .pill-d { font-family: var(--font-mono); font-size: 8.2px; font-weight: 700; padding: 1.5px 6px; border-radius: 3px; background: var(--ink-primary); color: #FFFFFF; }
    .pill-badge { font-size: 8.2px; font-weight: 700; padding: 1.5px 6px; border-radius: 3px; color: #FFFFFF; background: var(--accent-cobalt); }
    .pill-badge.ult { background: var(--accent-ochre); }
    .pill-badge.warn { background: var(--accent-crimson); }
    .d-sku-top { font-family: var(--font-mono); font-size: 8.3px; color: var(--ink-muted); }
    .dossier-head h3 { font-size: 12.2px; line-height: 1.25; margin-bottom: 2px; }
    .d-price { font-size: 10.6px; font-weight: 700; color: var(--accent-ochre); }
    .d-price small { font-size: 8.5px; color: var(--ink-muted); font-weight: 400; margin-left: 6px; }

    .d-specs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px 10px;
      background: var(--bg-tint);
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 8.5px;
    }
    .d-specs-grid b { color: var(--ink-muted); font-weight: 600; margin-right: 4px; }

    .d-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .d-off-box {
      background: #FAFBFD;
      border: 1px solid var(--border-hair);
      border-radius: 4px;
      padding: 5px 7px;
      font-size: 8.4px;
      color: var(--ink-secondary);
      line-height: 1.38;
    }
    .d-off-title { font-weight: 700; color: var(--ink-primary); margin-bottom: 2px; font-size: 8.6px; }
    .d-size-box {
      background: var(--bg-cobalt-soft);
      border-left: 2.5px solid var(--accent-cobalt);
      border-radius: 0 4px 4px 0;
      padding: 5px 7px;
      font-size: 8.4px;
      color: var(--ink-primary);
      line-height: 1.38;
    }
    .d-size-title { font-weight: 700; color: var(--accent-cobalt); margin-bottom: 2px; font-size: 8.6px; }

    .d-rationale {
      margin: 0;
      padding-left: 14px;
      font-size: 8.5px;
      color: var(--ink-primary);
      line-height: 1.38;
    }
    .d-rationale li { margin-bottom: 2px; }

    .d-audit-ledger {
      border: 1px solid #C6DEC9;
      border-radius: 4px;
      overflow: hidden;
      font-size: 8.2px;
      background: var(--bg-pine-soft);
    }
    .d-audit-row {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid #D9EAD9;
    }
    .d-audit-row:last-child { border-bottom: none; }
    .d-audit-k {
      width: 68px;
      flex-shrink: 0;
      background: #1B4D2B;
      color: #FFFFFF;
      font-weight: 700;
      padding: 2.5px 5px;
      display: flex;
      align-items: center;
      font-size: 8px;
    }
    .d-audit-v {
      flex: 1;
      padding: 2.5px 7px;
      color: #1A3623;
      line-height: 1.34;
    }

    .d-links-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      align-items: center;
      font-size: 8.3px;
      padding-top: 2px;
    }
    .d-sku-flag {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 7.8px;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--bg-pine-soft);
      color: var(--accent-pine);
      border: 1px solid #B7D7BF;
    }
    .d-sku-flag.warn {
      background: var(--bg-amber-soft);
      color: var(--accent-ochre);
      border-color: #EBD1A7;
    }

    /* Page 7 & 8 extras */
    .rules-box {
      margin-top: 8px;
      background: var(--bg-amber-soft);
      border: 1.2px solid var(--accent-ochre);
      border-radius: 5px;
      padding: 7px 10px;
      flex-shrink: 0;
    }
    .rules-box h3 { font-size: 10.5px; color: var(--accent-ochre); margin-bottom: 5px; }
    .rules-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      font-size: 8.5px;
      line-height: 1.38;
    }

    .grid-2x2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
      margin-top: 6px;
      flex-shrink: 0;
    }
    .elim-item {
      background: var(--bg-crimson-soft);
      border: 1px solid #F3C6C6;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 8.3px;
      line-height: 1.36;
    }
    .elim-item h4 { font-size: 9.2px; color: var(--accent-crimson); margin-bottom: 2px; }

    .finding-item {
      background: var(--bg-pine-soft);
      border: 1px solid #C6DEC9;
      border-left: 3px solid var(--accent-pine);
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 8.3px;
      line-height: 1.36;
    }
    .finding-item.warn {
      background: var(--bg-crimson-soft);
      border-color: #F3C6C6;
      border-left-color: var(--accent-crimson);
    }
    .finding-k { font-family: var(--font-mono); font-size: 7.9px; font-weight: 700; color: var(--accent-pine); margin-bottom: 2px; }
    .finding-item.warn .finding-k { color: var(--accent-crimson); }
    .finding-item h4 { font-size: 9.2px; margin-bottom: 2px; }

    .deliverable-strip {
      margin-top: 8px;
      background: var(--bg-tint);
      border: 1px solid var(--border-hair);
      border-radius: 5px;
      padding: 7px 10px;
      font-size: 8.4px;
      line-height: 1.45;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="print-root"></div>

  <script src="./data.js"></script>
  <script>
    (function () {
      const D = window.HARDSHELL_DATA;
      if (!D) return;
      const pMap = Object.fromEntries(D.products.map(p => [p.id, p]));
      const root = document.getElementById('print-root');
      const totalPages = 8;

      function headHtml() {
        return `
          <div class="running-head">
            <span>NE-WINTER EXTREME COLD HARDSHELL BUYING GUIDE (-15°C ~ -35°C)</span>
            <span>男 180cm / 80kg（鞋 EU44 · 裤 48）· 美利奴+黑冰F1106KH+波司登适配版</span>
          </div>`;
      }

      function footHtml(pageNo) {
        return `
          <div class="running-foot">
            <span>东北冬季极寒徒步 · 硬壳冲锋衣外层深度采购指南（10 款全横向对比与反 AI 软文审计）</span>
            <span class="mono">第 ${pageNo} / ${totalPages} 页</span>
          </div>`;
      }

      function dossierCard(p) {
        const badgeCls = p.isUltimate ? 'ult' : (p.ultimateTitle.includes('⚠️') ? 'warn' : '');
        return `
          <article class="dossier ${p.isUltimate ? 'is-ult' : ''}">
            <div class="dossier-top">
              <div class="dossier-img"><img src="${p.image}" alt="${p.brandCn}"></div>
              <div class="dossier-head">
                <div class="d-pills">
                  <span class="pill-d">#${String(p.rank).padStart(2, '0')} · ${p.categoryLabel}</span>
                  <span class="pill-badge ${badgeCls}">${p.ultimateTitle}</span>
                  <span class="d-sku-top">SKU: ${p.sku}</span>
                </div>
                <h3>${p.brandCn} (${p.brand}) · ${p.name}</h3>
                <div class="d-price">${p.price.display} <small>${p.price.officialRef}</small></div>
              </div>
            </div>

            <div class="d-specs-grid">
              <div><b>防水薄膜：</b>${p.specs.membrane}</div>
              <div><b>面布/D数：</b>${p.specs.faceFabric}</div>
              <div><b>防水/透气：</b>${p.specs.waterproofMm.split('（')[0]} | ${p.specs.breathabilityMetric.split('（')[0]}</div>
              <div><b>成衣克重：</b>${p.specs.garmentWeight} ｜ ${p.specs.pockets.split('（')[0]}</div>
              <div><b>拉链散热：</b>${p.specs.zippers}</div>
              <div><b>风帽/雪裙：</b>${p.specs.hoodAndSkirt}</div>
            </div>

            <div class="d-two-col">
              <div class="d-off-box">
                <div class="d-off-title">官方核心说明</div>
                <div>${p.officialDesc}</div>
              </div>
              <div class="d-size-box">
                <div class="d-size-title">180/80 叠穿黑冰 F1106KH 选码：${p.size180_80.pick.split('（')[0]}</div>
                <div>${p.size180_80.detail}</div>
              </div>
            </div>

            <ul class="d-rationale">
              ${p.rationale.map(r => `<li>${r}</li>`).join('')}
            </ul>

            <div class="d-audit-ledger">
              <div class="d-audit-row">
                <div class="d-audit-k">全平台评论盘</div>
                <div class="d-audit-v">${p.audit.totalReviewsPlatform}</div>
              </div>
              <div class="d-audit-row">
                <div class="d-audit-k">本次精读样本</div>
                <div class="d-audit-v">精读实评 <b>${p.audit.userReviewsRead} 条</b>${p.audit.qaRead ? ` + 官方问答 <b>${p.audit.qaRead} 组</b>` : ''} + 专业/渠道测评 <b>${p.audit.proTestsRead} 篇</b>（${p.audit.proTestSources}）</div>
              </div>
              <div class="d-audit-row">
                <div class="d-audit-k">关键原声/防骗</div>
                <div class="d-audit-v">${p.audit.userReviewQuotes[0]}；${p.audit.credibilityAndAdFilter}</div>
              </div>
            </div>

            <div class="d-links-row">
              <a href="${p.urls.official}">官网/技术归档 ↗</a>
              <a href="${p.urls.taobao}">${p.urls.taobaoLabel}</a>
              <a href="${p.urls.jd}">${p.urls.jdLabel}</a>
              <span class="d-sku-flag ${p.skuMatchOk ? '' : 'warn'}">${p.skuMatchOk ? '✓ 链接与SKU一致' : '⚠ 注意同链混售防坑'}</span>
            </div>
          </article>
        `;
      }

      // PAGE 1
      const page1 = `
        <section class="a4-page">
          <header class="masthead">
            <div class="masthead-kicker">Alpine Technical Field Dossier · 2026.11 · -15°C ~ -35°C Extreme Cold</div>
            <h1>${D.meta.title}</h1>
            <div class="masthead-sub">${D.meta.subtitle}</div>
          </header>

          <div class="top-pair">
            <div class="info-box">
              <div class="info-box-title">定制采购人身体参数与叠穿边界</div>
              <div class="kv-grid">
                <div><b>性别/身高/体重：</b>男 · 180 cm / 80 kg</div>
                <div><b>足/下装参考码：</b>鞋 EU 44 · 裤 48 码</div>
                <div><b>推算净胸围：</b>${D.meta.userProfile.estimatedChestCm}</div>
                <div><b>硬壳目标衣胸：</b>122 – 126 cm（兼容厚中层）</div>
              </div>
              <div class="info-foot"><b>既有装备边界：</b>${D.meta.userProfile.existingKit}。因 F1106KH 自带连帽且有立体蓬松絮片，L3 外壳领口与肩腋必须留余量防双帽卡颈；停步大休直接将波司登罩在硬壳最外层。</div>
            </div>
